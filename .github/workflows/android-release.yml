name: Android release

# Push a tag like v1.2.0 to build a signed release APK and attach it to a
# GitHub Release. The app's in-app updater reads the latest release from the
# GitHub API and installs the attached APK.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   PRISM_KEYSTORE_BASE64   base64 of your release keystore (.jks)
#   PRISM_KEYSTORE_PASSWORD keystore password
#   PRISM_KEY_ALIAS         key alias
#   PRISM_KEY_PASSWORD      key password
# Every release must be signed with the same key or Android will refuse to
# install the update over the existing app. See scripts/make-keystore.sh.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="0.0.0-manual"; fi
          # versionCode: major*10000 + minor*100 + patch, from the numeric part of the tag
          NUM=$(echo "$TAG" | sed -E 's/^([0-9]+)\.([0-9]+)\.([0-9]+).*/\1 \2 \3/')
          set -- $NUM
          CODE=$(( ${1:-0} * 10000 + ${2:-0} * 100 + ${3:-0} ))
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.PRISM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No PRISM_KEYSTORE_BASE64 secret set; building an unsigned APK." >&2
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          PRISM_KEYSTORE_PATH: ${{ secrets.PRISM_KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          PRISM_KEYSTORE_PASSWORD: ${{ secrets.PRISM_KEYSTORE_PASSWORD }}
          PRISM_KEY_ALIAS: ${{ secrets.PRISM_KEY_ALIAS }}
          PRISM_KEY_PASSWORD: ${{ secrets.PRISM_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PPRISM_VERSION_NAME="${{ steps.ver.outputs.name }}" \
            -PPRISM_VERSION_CODE="${{ steps.ver.outputs.code }}"

      - name: Rename APK
        run: |
          mkdir -p out
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$SRC" "out/prism-${{ steps.ver.outputs.name }}-release.apk"

      - name: Create GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        with:
          name: prism-release-apk
          path: out/*.apk
