server {
    listen 1111;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single page app fallback: every unknown path serves index.html.
    # A hash router is used, so this is mostly a safety net.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
